# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Yarn projects use the "npm" ecosystem: "yarn" is not a valid value and made
# Dependabot reject the whole file.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps land together instead of one PR per package.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Data collectors (python/requirements.txt).
  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns:
          - "*"

  # Keeps the workflow actions current, so a runtime deprecation (such as the
  # Node.js 20 actions) shows up as a PR instead of a broken run.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
