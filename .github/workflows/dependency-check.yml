name: Dependency check

# Weekly (and on demand) report of outdated packages and known vulnerabilities.
# The report is written to the job summary; the job never fails on its own so
# a pre-existing advisory does not block the pipeline.
on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'yarn.lock'

jobs:
  dependencies:
    name: Outdated packages and advisories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Write the report to the job summary
        run: node scripts/check-deps.mjs --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Print the advisories
        continue-on-error: true
        # yarn 1 ignores --level for its exit code, a bitmask of every severity
        # found (1 info, 2 low, 4 moderate, 8 high, 16 critical): keep only the
        # high and critical bits so a moderate advisory does not flag the step.
        run: yarn audit --level high || [ $(( $? & 24 )) -eq 0 ]
