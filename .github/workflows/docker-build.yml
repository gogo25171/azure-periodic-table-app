name: Docker Build

on:
  push:
    branches:
      - main
    paths:
      - 'docker/**'

jobs:
  build:
    runs-on: ubuntu-latest

    # A fork without the Docker Hub secrets skips the push instead of failing.
    env:
      HAS_DOCKER_CREDENTIALS: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}

    steps:
    - name: Check Out Repository
      uses: actions/checkout@v4

    - name: Report missing credentials
      if: env.HAS_DOCKER_CREDENTIALS != 'true'
      run: echo "DOCKER_USERNAME/DOCKER_PASSWORD are not set: skipping the image build." >> "$GITHUB_STEP_SUMMARY"

    - name: Login to Docker Hub
      if: env.HAS_DOCKER_CREDENTIALS == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      if: env.HAS_DOCKER_CREDENTIALS == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/azure-periodic-table-dockerversion:latest
