name: Update Code Snippets

on:
  schedule:
    - cron: '0 0 * * 0'  # Runs every Sunday at midnight
  pull_request:
    branches:
      - main
    paths:
      - 'python/**'
  
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-snippets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.x

    # The collector runs `terraform fmt` on the generated snippets.
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_wrapper: false

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute terraform-collector.py
      run: python3 terraform-collector.py

    - name: Check for changes
      id: git-diff
      run: |
        # `git status` also catches snippets created for the first time (untracked).
        if [ -z "$(git status --porcelain -- ..)" ]; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: List changed files
      id: list-changes
      run: |
        # -uall lists each new file instead of collapsing it into its folder.
        CHANGED_FILES=$(git status --porcelain -uall -- .. | awk '{print $2}' | tr '\n' ' ')
        echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_ENV

    - name: Commit and push
      if: steps.git-diff.outputs.changed == 'true' && github.event_name != 'pull_request'
      run: |
        git config user.name "GitHub Action Bot"
        git config user.email "github.bot@onwardplatforms.com"
        git checkout -b automated-code-snippet-update
        git add -A
        git commit -m "Automated update of code snippets"
        git push --force --set-upstream origin automated-code-snippet-update

    - name: Create pull request
      if: steps.git-diff.outputs.changed == 'true' && github.event_name != 'pull_request'
      run: |
        # `gh pr list` exits 0 even when nothing matches, so test its output
        if [ -z "$(gh pr list --base main --head automated-code-snippet-update --json number --jq '.[].number')" ]; then
          # Create a new PR
          gh pr create --base main --head automated-code-snippet-update --title "Automated update of code snippets" --body "${{ env.CHANGED_FILES }}"
        fi
      env:
        GH_TOKEN: ${{ github.token }}
